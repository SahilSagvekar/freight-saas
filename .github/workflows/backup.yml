name: Database backup

# Nightly encrypted dump of the live database to S3-compatible storage (Cloudflare R2, AWS S3, Backblaze B2).
# Needs these repository secrets: BACKUP_DATABASE_URL (owner/read-only URL), BACKUP_PASSPHRASE,
# BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT (blank for AWS), AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Set a lifecycle rule on the bucket to expire old dumps (30 days is a good start).
on:
  schedule:
    - cron: "17 21 * * *" # 02:47 in India, a quiet hour for ferries
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install a pg_dump new enough for the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
      - name: Dump, encrypt, upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PATH_PREFIX: /usr/lib/postgresql/17/bin
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          bash scripts/backup.sh
