name: Scheduled jobs

# Frees seats held by online bookings that were never paid. Needs repository secrets APP_URL (https://…) and CRON_SECRET
# (the same value as the app's CRON_SECRET).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  expire-holds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/expire-holds"
