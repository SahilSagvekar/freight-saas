name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm ci` already runs `prisma generate` through postinstall.
      - run: npm run lint
      - run: npm run typecheck
      # Boots its own throwaway Postgres (embedded-postgres), so no database service is needed.
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          ADMIN_DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          APP_URL: https://ci.invalid

  # Runs only for pushes to main, and only when every check above passed.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time; a newer push waits instead of cancelling a running deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The key on the server is locked to scripts/deploy.sh, so this line can only deploy.
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "${{ github.sha }}"
